<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SS PLAY Admin</title><link rel="stylesheet" href="admin.css"></head><body>
<header><a href="index.html" class="brand"><span>SS</span> PLAY</a><div>Admin Dashboard</div><button id="logout">Sign out</button></header>
<main><section class="login" id="loginBox"><h1>SS PLAY Admin</h1><p>Authorized administrators only.</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="login">Sign in</button><small id="loginMsg"></small></section>
<section id="dashboard" class="hidden"><div class="grid"><div class="stat"><small>Published</small><b id="published">0</b></div><div class="stat"><small>Premium</small><b id="premium">0</b></div><div class="stat"><small>Drafts</small><b id="drafts">0</b></div></div>
<div class="panel"><div class="head"><h2>Content</h2><button id="newContent">+ Add content</button></div><div id="contentList"></div></div>
<div class="panel"><h2>Add / Edit Content</h2><div class="formgrid"><input id="title" placeholder="Title"><select id="type"><option>movie</option><option>series</option><option>short</option><option>live</option></select><input id="genre" placeholder="Genre"><input id="poster" placeholder="Poster image URL"><input id="video" placeholder="Authorized video URL"><select id="access"><option value="free">Free</option><option value="premium">Premium</option></select><select id="status"><option value="draft">Draft</option><option value="published">Published</option></select><textarea id="description" placeholder="Description"></textarea></div><div class="actions"><button id="save">Save content</button><button id="clear" class="ghost">Clear</button></div><small id="saveMsg"></small></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
